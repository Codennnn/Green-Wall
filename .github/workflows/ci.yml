name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next/root-params、PageProps 等类型由此生成，缺失时 next/root-params 会退化成 any
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm lint:ts

      # 不带 --fix：CI 只检查，不静默改写源码
      - name: ESLint
        run: pnpm exec eslint "**/*.{ts,tsx}"

      - name: Stylelint
        run: pnpm lint:css

      - name: Build
        run: pnpm build

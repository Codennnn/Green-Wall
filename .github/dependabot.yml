version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      # 所有 minor / patch 合并成一个 PR，避免多个 PR 各自重算 pnpm-lock.yaml 互相冲突
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # major 升级单独成组，便于人工评估破坏性变更
      major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
